name: Production Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend

jobs:
  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    if: >-
      ${{
        vars.CLOUDFLARE_PAGES_PROJECT != '' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.4

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Build production frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node -e 'require("node:fs").writeFileSync("dist/version.json", JSON.stringify({commit: process.env.DEPLOY_SHA, deployedAt: new Date().toISOString()}))'
        env:
          VITE_API_URL: /api

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ env.DEPLOY_SHA }}

      - name: Verify the production revision
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          actual_sha="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${PRODUCTION_URL%/}/version.json" | jq -r '.commit')"
          test "$actual_sha" = "$DEPLOY_SHA"
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

  publish-backend:
    name: Publish backend image
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.tags }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.DEPLOY_SHA }}

      - name: Build and publish backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: APP_VERSION=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Trigger backend rollout
    needs:
      - publish-backend
    if: ${{ needs.publish-backend.result == 'success' && vars.BACKEND_DEPLOY_HOOK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger the hosting provider
        run: |
          test -n "$BACKEND_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --data "{\"commit\":\"$DEPLOY_SHA\",\"image\":\"sha-$DEPLOY_SHA\"}" \
            "$BACKEND_DEPLOY_HOOK_URL"
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}

      - name: Verify the backend revision
        run: |
          actual_sha="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${PRODUCTION_URL%/}/api/version" | jq -r '.commit')"
          test "$actual_sha" = "$DEPLOY_SHA"
          curl --fail --silent --show-error "${PRODUCTION_URL%/}/api/ready" | jq -e '.status == "ready"'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
