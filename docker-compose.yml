# Local dev. Backend only in v1; Redis placeholder commented for when we
# upgrade the session checkpointer (plan §7.4).
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    restart: unless-stopped

  # Uncomment when upgrading from InMemorySaver to AsyncRedisSaver.
