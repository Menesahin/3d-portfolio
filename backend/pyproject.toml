[project]
name = "enes-portfolio-backend"
version = "0.1.0"
description = "LangGraph-powered mascot agent for the 3D-world portfolio."
requires-python = ">=3.13"
dependencies = [
  # Web layer
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "structlog>=24.4,<26",
  # Agent layer — loose upper bounds while the ecosystem is still moving.
  # Prebuilt + checkpoint are transitive from langgraph but listed explicitly
  # so we can pin them individually once the stack stabilises.
  "langgraph>=0.2.60,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "openai>=1.54",
  # Per-IP rate limiting on /chat. In-memory store is fine for single-worker
  # uvicorn; swap the storage URI to Redis if we ever scale horizontally.
  "slowapi>=0.1.9,<1",
  # Tracing tools — both deferred to v2 (see plan §7.7). Uncomment one when ready.
  # "langfuse>=2.50",
  # "langsmith>=0.1.140",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==1.3.0",
  "ruff==0.8.6",
  "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
